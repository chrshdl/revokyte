<!-- .github/logo.svg centered on a square canvas (81% height) — the source
     for the app icons. Regenerate with ImageMagick + iconutil:
       magick -background none -size 1024x1024 icon-square.svg icon-1024.png
       mkdir Revokyte.iconset
       for s in 16 32 128 256 512; do
         magick icon-1024.png -resize ${s}x${s} Revokyte.iconset/icon_${s}x${s}.png
         magick icon-1024.png -resize $((s*2))x$((s*2)) Revokyte.iconset/icon_${s}x${s}@2x.png
       done
       iconutil -c icns Revokyte.iconset -o Revokyte.icns
       magick icon-1024.png -define icon:auto-resize=256,128,64,48,32,24,16 Revokyte.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <g transform="translate(26.15 12) scale(0.832)">
    <path fill="#3dd1d8" fill-rule="evenodd" d="M2.3 3 H89 L76.5 17 H54.3 V80 L12.5 121.7 H7 L2.3 117 Z M18 17 H38.2 V76 L18 96.2 Z"/>
  </g>
</svg>
