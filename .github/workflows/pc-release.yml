name: PC builds

# Every v* tag produces unsigned desktop binaries (Windows .exe, macOS .app)
# attached to the tag's GitHub release. Builds are unsigned on purpose —
# SmartScreen/Gatekeeper first-run notes live in the README's desktop section.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default workflow token is read-only; attaching binaries to the tag's
# release (which the bump-os flow may have already created) needs write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Revokyte-windows-x64
          # Apple Silicon. For an Intel build, add a macos-*-intel (or
          # macos-13) entry with artifact Revokyte-macos-x86_64.
          - os: macos-latest
            artifact: Revokyte-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[pc]" pyinstaller

      - name: Build
        run: pyinstaller --noconfirm packaging/pyinstaller/Revokyte.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Revokyte.app "dist/${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/Revokyte.exe "dist/${{ matrix.artifact }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.exe
          if-no-files-found: error

      # Creates the release for the tag if it doesn't exist yet, otherwise
      # appends the file to it.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.exe
