name: Bump OS package

on:
  push:
    tags: ['v*']

# contents: write — needed to create the release and upload the source asset.
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Parse version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Full history + tags so git archive's export-subst fills
      # .git_archival.txt (describe-name needs the tag objects) — that file is
      # how setuptools_scm derives the app version from the tarball.
      - name: Checkout at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Build the source tarball ourselves and publish it as a release asset:
      # release assets are immutable bytes, unlike GitHub's autogenerated
      # codeload tarballs, whose compression has changed before and broken
      # the sha256 pin in instrument-cluster-os. The OS repo fetches exactly
      # this asset (see PYTHON_INSTRUMENT_CLUSTER_SITE there).
      - name: Build source archive and compute sha256
        id: hash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="python-instrument-cluster-${VERSION}/" \
            -o "python-instrument-cluster-${VERSION}.tar.gz" "v${VERSION}"
          echo "sha256=$(sha256sum "python-instrument-cluster-${VERSION}.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi
          # --clobber so a rerun of this workflow stays consistent: the hash
          # pushed below is always computed from the bytes uploaded here.
          gh release upload "v${VERSION}" "python-instrument-cluster-${VERSION}.tar.gz" --clobber

      - name: Checkout instrument-cluster-os
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revokyte/instrument-cluster-os
          token: ${{ secrets.INSTRUMENT_CLUSTER_OS_REPO_PAT }}
          path: os

      - name: Patch .mk and .hash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.hash.outputs.sha256 }}"
          MK="os/package/python-instrument-cluster/python-instrument-cluster.mk"
          HASH="os/package/python-instrument-cluster/python-instrument-cluster.hash"

          sed -i "s/^PYTHON_INSTRUMENT_CLUSTER_VERSION = .*/PYTHON_INSTRUMENT_CLUSTER_VERSION = ${VERSION}/" "$MK"
          sed -i "s|^sha256  [0-9a-f]*  python-instrument-cluster-.*\.tar\.gz$|sha256  ${SHA256}  python-instrument-cluster-${VERSION}.tar.gz|" "$HASH"

      - name: Commit and push
        working-directory: os
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package/python-instrument-cluster/
          git commit -m "python-instrument-cluster: bump to ${{ github.ref_name }}"
          git push

      - name: Checkout instrument-cluster-pro-os
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revokyte/instrument-cluster-pro-os
          token: ${{ secrets.INSTRUMENT_CLUSTER_OS_PRO_REPO_PAT }}
          path: os-pro

      # pro-os has no upstream remote to carry the app pin over via merge
      # (see PRO-NOTES.md) — it maintains its own copy of
      # package/python-instrument-cluster/, so patch it directly here too.
      - name: Patch .mk and .hash (pro-os app pin)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.hash.outputs.sha256 }}"
          MK="os-pro/package/python-instrument-cluster/python-instrument-cluster.mk"
          HASH="os-pro/package/python-instrument-cluster/python-instrument-cluster.hash"

          sed -i "s/^PYTHON_INSTRUMENT_CLUSTER_VERSION = .*/PYTHON_INSTRUMENT_CLUSTER_VERSION = ${VERSION}/" "$MK"
          sed -i "s|^sha256  [0-9a-f]*  python-instrument-cluster-.*\.tar\.gz$|sha256  ${SHA256}  python-instrument-cluster-${VERSION}.tar.gz|" "$HASH"

      - name: Commit and push (pro-os)
        working-directory: os-pro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package/python-instrument-cluster/
          git commit -m "python-instrument-cluster: bump to ${{ github.ref_name }}"
          git push