name: Bump OS package

on:
  push:
    tags: ['v*']

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Parse version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download tarball and compute sha256
        id: hash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -sL "https://github.com/chrshdl/revokyte/archive/v${VERSION}.tar.gz" \
            -o tarball.tar.gz
          echo "sha256=$(sha256sum tarball.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout instrument-cluster-os
        uses: actions/checkout@v4
        with:
          repository: chrshdl/instrument-cluster-os
          token: ${{ secrets.INSTRUMENT_CLUSTER_OS_REPO_PAT }}

      - name: Patch .mk and .hash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.hash.outputs.sha256 }}"
          MK="package/python-instrument-cluster/python-instrument-cluster.mk"
          HASH="package/python-instrument-cluster/python-instrument-cluster.hash"

          sed -i "s/^PYTHON_INSTRUMENT_CLUSTER_VERSION = .*/PYTHON_INSTRUMENT_CLUSTER_VERSION = ${VERSION}/" "$MK"
          sed -i "s|^sha256  [0-9a-f]*  python-instrument-cluster-.*\.tar\.gz$|sha256  ${SHA256}  python-instrument-cluster-${VERSION}.tar.gz|" "$HASH"

      - name: Commit, push, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package/python-instrument-cluster/
          git commit -m "python-instrument-cluster: bump to ${{ github.ref_name }}"
          git push
          git push
